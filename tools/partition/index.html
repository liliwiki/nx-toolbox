<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>换卡</title>
<style>/*BASE_CSS*/
/* 换卡自己的样式 */
.empty{display:flex;align-items:center;gap:16px;padding:22px}
.empty .slot{color:var(--faint);animation:breathe 2.6s var(--ease) infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
/* 容量条：和系统设置里的"储存空间"一个意思，一段颜色是一类内容 */
.stor{display:flex;gap:2px;height:20px;border-radius:6px;overflow:hidden;background:var(--fill)}
.stor i{display:block;min-width:4px;flex-basis:0;transition:flex-grow .7s var(--ease)}
.lg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.lg i{width:8px;height:8px;border-radius:50%;flex:none}
/* 颜色和 hekate 分区管理里的一样：文件绿、虚拟系统红、Linux 青、Android 橙。浅色背景下绿和青稍微压深一点 */
:root{--c-files:#5FBF00;--c-emu:#FF3C28;--c-linux:#00B4D0;--c-android:#FF8000}
@media (prefers-color-scheme:dark){:root:not([data-scheme="light"]){--c-files:#96FF00;--c-linux:#00DDFF}}
:root[data-scheme="dark"]{--c-files:#96FF00;--c-linux:#00DDFF}
.c-files,.c-fat{background:var(--c-files)}.c-emufile{background:var(--c-emu)}
.c-files.c-free{background:var(--fill-h)}.c-emummc{background:var(--c-emu)}.c-linux{background:var(--c-linux)}.c-android{background:var(--c-android)}
.box{padding:16px;display:grid;gap:12px}
.box h3{display:flex;align-items:center;gap:8px}
.arrowdown{display:grid;place-items:center;color:var(--faint);margin:-6px 0}
.arrowdown svg{transform:rotate(90deg)}
.warn{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--orange) 12%,transparent);color:var(--orange);font-size:13px}
.warn b{font-weight:600}
/* 步骤 */
/* 进度：当前这一步 */
.now-card{padding:22px 22px 18px;display:grid;gap:14px}
.now-top{display:flex;align-items:flex-end;gap:16px}
.now-top .eb{font-size:12px;font-weight:600;color:var(--link);margin-bottom:4px}
.now-top h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.pct{margin-left:auto;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.pct small{font-size:20px;font-weight:500;color:var(--muted);margin-left:1px;letter-spacing:0}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar b{display:block;height:100%;border-radius:4px;background:var(--blue);transform-origin:left;transform:scaleX(0);transition:transform .45s var(--ease),background .3s}
.paused .bar b{background:var(--faint)}
.meta{display:flex;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}
.meta span:last-child{margin-left:auto}
.cur{display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px solid var(--hair);min-width:0}
.cur .gi{color:var(--link)}
.cur div{min-width:0;flex:1}
.cur strong{display:block;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cur span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cur span.dir{direction:rtl;text-align:left}
.cur span bdi{direction:ltr}
.cur[hidden]{display:none}
/* 进度：步骤清单，每一步一个进度环 */
.stl{display:grid}
.sr{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--hair);color:var(--faint);transition:color .3s}
.sr:first-child{border-top:0}
.sr .nm{flex:1;min-width:0}
.sr .nt{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sr.done{color:var(--text)}
.sr.now{color:var(--text);font-weight:500}
.ring{width:22px;height:22px;flex:none}
.ring .tk{stroke:var(--fill-h)}
.ring .ar{stroke:var(--blue);stroke-dasharray:59.7;stroke-dashoffset:59.7;transition:stroke-dashoffset .45s var(--ease)}
.ring .ok{opacity:0;transform:scale(.6);transform-origin:center;transition:opacity .3s,transform .4s var(--ease)}
.sr.done .ring .ok{opacity:1;transform:none}
.sr.done .ring .ar,.sr.done .ring .tk{opacity:0}
.paused .sr.now .ring .ar{stroke:var(--faint)}
/* 调大小的滑杆 */
.size{display:grid;gap:8px}
.size .hd{display:flex;align-items:baseline;gap:8px}
.size .val{margin-left:auto;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.range{appearance:none;-webkit-appearance:none;width:100%;height:22px;margin:0;background:none;cursor:pointer}
.range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--blue) var(--fill-to,0%),var(--fill-h) var(--fill-to,0%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #00000047,0 0 0 .5px #0000001f;transition:transform .2s var(--ease)}
.range:active::-webkit-slider-thumb{transform:scale(1.12)}
.range:disabled{opacity:.45;cursor:default}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
/* 分区列表 */
.pl{display:grid}
.pr{display:grid;gap:10px;padding:13px 16px;border-top:1px solid var(--hair);transition:opacity .3s}
.pr:first-child{border-top:0}
.pr .hd{display:flex;align-items:center;gap:10px}
.pr .dot{width:10px;height:10px;border-radius:50%;flex:none}
.pr .tt{flex:1;min-width:0}
.pr .tt strong{display:block;font-weight:500}
.pr .tt span{display:block;font-size:12px;color:var(--muted)}
.pr .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr.gone .tt strong,.pr.gone .v{color:var(--faint)}
.pr.gone .dot{opacity:.35}
.pr .v.del{color:var(--red);font-weight:500;font-size:13px}
.pr .acts{display:flex;gap:4px}
.pr .btn.txt{height:26px}
.pr .btn.txt.red{color:var(--red)}
.pr .sz{display:grid;gap:4px;padding-left:20px}
.pr .hint{font-size:12px;color:var(--muted);padding-left:20px}
.chg{display:grid;gap:4px;font-size:13px;margin:0;padding-left:18px}
.chg li.d{color:var(--red)}
.busy{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--blue);border-top-color:transparent;animation:spin .8s linear infinite;vertical-align:-2px}
.pick:disabled{opacity:.5;pointer-events:none}
.navbar .navback[hidden]{display:none}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="main">
    <header class="navbar" id="navbar"><button class="navback" id="back" hidden></button><div class="navtitle" id="navtitle"></div><span></span></header>
    <div class="page" id="page"></div></main>
</div>
<script>/*BASE_JS*/</script>
<script>
let api;
/* phase：old 选旧卡 → loading → info 看旧卡、选去处 → target 确认新卡 → run → saved 存好了，等新卡 / done */
const S = { page: 'move', phase: 'old', cards: [], src: null, info: null, stage: null, target: null, sizes: {}, done: null, run: null, running: false, R: { phase: 'pick' }, job: false, paused: false, opts: {}, notice: '' };
const VIEW = {};
const POLL_CARDS_MS = 1500, GB = 1073741824;
const KIND = { emummc: '虚拟系统', emufile: '虚拟系统', linux: 'Linux', android: 'Android' };
const BACK = { info: '换卡', target: '返回' }, RBACK = { edit: '调整分区' };
// 不到 1 GB 的用 MB，免得显示成 0.0 GB
const gb = n => n < GB ? Math.max(1, Math.round(n / 1048576)) + ' MB' : (n / GB >= 100 ? Math.round(n / GB) : (n / GB).toFixed(1)) + ' GB';
const cardLine = c => `${gb(c.size)}${c.letters && c.letters.length ? ' · ' + c.letters.map(l => l.replace('\\', '')).join(' ') : ''}`;

/* ---------- 框架 ---------- */
function reset(notice = '') { S.phase = 'old'; S.src = S.info = S.target = S.done = null; S.sizes = {}; S.notice = notice; }
const { drawSide, draw, follow } = toolShell({ state: S, api: () => api, brand: '换卡', views: VIEW,
  pages: [{ id: 'move', name: '换卡', title: '换卡', icon: 'sd' }, { id: 'resize', name: '调整分区', title: '调整分区', icon: 'layers' },
    { id: 'settings', name: '设置', title: '设置', icon: 'gear', bottom: true }],
  back: () => S.running ? '' : S.page === 'move' ? BACK[S.phase] : S.page === 'resize' ? RBACK[S.R.phase] : '',
  onBack: () => {
    if (S.page === 'resize') { S.R = { phase: 'pick' }; draw(); return; }
    if (S.phase === 'target') { S.target = null; S.phase = S.src.kind === 'stage' ? 'saved' : 'info'; } else reset();
    draw();
  } });

/* ---------- 存储卡 ---------- */
async function watchCards() {
  for (;;) {
    try {
      if (!S.job) {
        const cards = await api.cards();
        const changed = JSON.stringify(cards.map(c => [c.number, c.size])) !== JSON.stringify(S.cards.map(c => [c.number, c.size]));
        S.cards = cards;
        const has = n => cards.some(c => c.number === n);
        if (S.src && S.src.kind === 'disk' && ['info', 'target', 'loading'].includes(S.phase) && !has(S.src.number)) { reset('旧卡已断开。再插上会自动识别。'); if (S.page === 'move') draw(); }
        else if (S.phase === 'target' && !has(S.target.target.number)) { S.target = null; S.phase = S.src.kind === 'stage' ? 'saved' : 'info'; if (S.page === 'move') draw(); toast('新卡已断开'); }
        else if (changed && S.page === 'move' && ['old', 'info', 'saved'].includes(S.phase)) draw(true);
        if (S.R.number != null && ['edit', 'loading'].includes(S.R.phase) && !has(S.R.number)) { S.R = { phase: 'pick', notice: '这张卡已断开。再插上会自动识别。' }; if (S.page === 'resize') draw(); }
        else if (changed && S.page === 'resize' && S.R.phase === 'pick') draw(true);
      }
    } catch (e) { /* 下一轮再试 */ }
    await sleep(POLL_CARDS_MS);
  }
}
async function pickOld(card) {
  S.src = { kind: 'disk', number: card.number }; S.phase = 'loading'; S.notice = ''; draw();
  const [info, stage] = await Promise.all([api.inspect(card.number), api.stage()]);
  if (S.phase !== 'loading' || S.src.number !== card.number) return;
  if (info.error) { reset(); draw(); tell('读不了这张卡', esc(info.error)); return; }
  S.info = info; S.stage = stage; S.phase = 'info'; draw();
}
async function pickTarget(card) {
  S.sizes = {};
  const r = await api.check(S.src, card.number, S.sizes);
  if (r.error) { tell('这张卡不能用', esc(r.error)); return; }
  S.target = r; S.phase = 'target'; draw();
}

/* ---------- 容量条 ---------- */
function storage(total, files, fat, extras) {
  const segs = [['files', '文件', files], ['free', '空闲', Math.max(0, fat - files)], ...extras.map(e => [e.kind, KIND[e.kind], e.bytes])];
  const merged = [];
  segs.forEach(([k, n, v]) => { const m = merged.find(x => x[0] === k); m ? m[2] += v : merged.push([k, n, v]); });
  return `<div class="stor" role="img" aria-label="${merged.map(([, n, v]) => `${n} ${gb(v)}`).join('，')}">${segs.map(([k, , v]) => `<i class="c-${k}" style="flex-grow:${Math.max(v / total, 0.004)}"></i>`).join('')}</div>
    <div class="lg">${merged.map(([k, n, v]) => `<span><i class="c-${k}"></i>${n} ${gb(v)}</span>`).join('')}</div>`;
}
const emuText = i => [i.emu_raw ? `分区形式${i.emu_raw > 1 ? ` × ${i.emu_raw}` : ''}` : '', i.emu_file.length ? `文件形式${i.emu_file.length > 1 ? ` × ${i.emu_file.length}` : ''}` : ''].filter(Boolean).join('，') || '没有';

/* ---------- 换卡 ---------- */
VIEW.move = pg => S.running ? viewRun(pg) : ({ old: viewOld, loading: viewLoading, info: viewInfo, target: viewTarget, saved: viewSaved, done: viewDone }[S.phase](pg));

function cardList(cards, emptyTitle, emptyText) {
  if (!cards.length) return `<div class="card empty"><div class="slot">${ic('sd', 44)}</div><div><h3>${emptyTitle}</h3><p class="muted" style="margin-top:4px">${emptyText}</p></div></div>`;
  return `<div class="card">${cards.map(c => `<button class="pick" data-n="${c.number}"><span class="gi">${ic('sd')}</span><div style="flex:1"><strong style="font-weight:500">${esc(c.name)}</strong><div class="small muted">${cardLine(c)}</div></div>${ic('chev', 16, 'faint')}</button>`).join('')}</div>`;
}
function savedCard() {
  const s = S.stage && S.stage.saved;
  if (!s) return '';
  const at = new Date(s.saved_at * 1000), when = `${at.getMonth() + 1} 月 ${at.getDate()} 日 ${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')}`;
  return `<div class="sec">存在电脑上的旧卡</div><div class="card"><div class="li"><div><strong>${esc(s.name)}</strong><span class="d">${when} 保存 · ${gb(s.copy_bytes)} · ${fmt(s.files.files)} 个文件</span></div><button class="btn" id="drop">删除</button><button class="btn pri" id="resume">写入新卡</button></div></div>`;
}
function bindSaved() {
  if (!$('#resume')) return;
  $('#resume').onclick = () => { S.src = { kind: 'stage' }; S.info = S.stage.saved; S.phase = 'saved'; draw(); };
  $('#drop').onclick = async () => {
    if (!await ask({ title: '删除存在电脑上的旧卡内容？', body: `会释放 ${gb(S.stage.saved.copy_bytes)}。旧卡本身不受影响。`, ok: '删除', danger: true })) return;
    S.stage = await api.discard(); draw(true);
  };
}
async function viewOld(pg) {
  pg.innerHTML = `<h1>换卡</h1><p class="lead">把旧卡上的全部内容搬到新卡，包括虚拟系统。旧卡不会被改动。</p>
    <span id="sv"></span>
    <div class="sec">选择旧卡</div>
    ${cardList(S.cards, S.notice ? esc(S.notice) : '正在等待存储卡…', '把旧卡插到电脑上，会自动出现在这里。')}`;
  $$('.pick', pg).forEach(b => b.onclick = () => pickOld(S.cards.find(c => c.number === +b.dataset.n)));
  S.stage = await api.stage();
  if ($('#sv') && S.phase === 'old') { $('#sv').outerHTML = savedCard(); bindSaved(); }
}
function viewLoading(pg) {
  pg.innerHTML = `<h1>换卡</h1><div class="card empty"><span class="busy"></span><div><h3>正在读取这张卡…</h3><p class="muted" style="margin-top:4px">要数一遍卡上的文件，文件多的话需要一会儿。</p></div></div>`;
}
function oldBox(i) {
  return `<div class="card box"><div class="dev"><span class="ico">${ic('sd', 22)}</span><div><strong>${esc(i.name)}</strong><span class="small muted">${i.size ? gb(i.size) : ''}${i.letter ? ' · ' + esc(i.letter.replace('\\', '')) : ''}</span></div></div>
    ${storage(i.size, i.files.bytes, i.fat_bytes, i.extras)}
    <dl class="kv"><dt>文件</dt><dd>${fmt(i.files.files)} 个，${gb(i.files.bytes)}</dd><dt>虚拟系统</dt><dd>${emuText(i)}</dd><dt>新卡至少要</dt><dd>${gb(i.min_bytes)}</dd></dl></div>`;
}
function viewInfo(pg) {
  const i = S.info, st = S.stage, others = S.cards.filter(c => c.number !== S.src.number), enough = st.free > i.copy_bytes + 128 * 1048576;
  pg.innerHTML = `<h1>旧卡</h1>${oldBox(i)}
    <div class="sec">搬到新卡</div>
    ${cardList(others, '把新卡插到另一个读卡器上', '会自动出现在这里。新卡上现有的内容会被清除。')}
    <div class="sec">只有一个读卡器</div>
    <div class="card"><div class="li"><div><strong>先存到电脑，再换上新卡</strong><span class="d">需要 ${gb(i.copy_bytes)}，这个位置还剩 ${gb(st.free)}</span><span class="d mono">${esc(st.dir)}</span></div><button class="btn" id="chdir">更改…</button><button class="btn pri" id="save" ${enough ? '' : 'disabled'}>存到电脑</button></div></div>`;
  $$('.pick', pg).forEach(b => b.onclick = () => pickTarget(others.find(c => c.number === +b.dataset.n)));
  $('#chdir').onclick = async () => { const r = await api.pick_stage_dir(); if (!r.cancelled) { S.stage = r; draw(true); } };
  $('#save').onclick = async () => {
    if (st.saved && !await ask({ title: '电脑上已经存着一张旧卡', body: `${esc(st.saved.name)} 的内容会被这次的替换掉。`, ok: '替换', danger: true })) return;
    const r = await api.start_save(S.src.number);
    if (r.error) { tell('现在开始不了', esc(r.error)); return; }
    runJob(r.steps, '把旧卡存到电脑', '请不要拔出旧卡。', moveEnded);
  };
}
const STEP = 256 * 1048576;        // 滑杆一格 256 MB
const DOT = { emummc: 'c-emummc', emufile: 'c-emummc', linux: 'c-linux', android: 'c-android' };
/* 卡上所有分区：放文件的空间自动算；虚拟系统可以调大小；能删的可以删（大小调成 0）。
   t 是 check 的结果，sizes 是现在选的（id → 字节），onChange(新的 sizes) 由页面去重新检查 */
function partsList(t, sizes, onChange) {
  const rows = t.parts.map(g => {
    const gone = !g.new_bytes, changed = g.new_bytes !== g.bytes;
    let sub = `原来 ${gb(g.bytes)}`;
    if (g.resizable) sub += ` · 系统空间用了 ${gb(g.user_used)}`;
    if (g.kind === 'emufile') sub += ' · 在放文件的空间里';
    const min = g.resizable ? Math.ceil(g.min_bytes / STEP) * STEP : 0, max = g.resizable ? Math.max(min, Math.floor(g.max_bytes / STEP) * STEP, g.bytes) : 0;
    const slider = g.resizable && !gone ? `<div class="sz"><input class="range" type="range" min="${min}" max="${max}" step="${STEP}" value="${g.new_bytes}" aria-label="${esc(g.label)}的大小" ${max <= min ? 'disabled' : ''}>
      <div class="ends"><span>最小 ${gb(min)}</span><span>最大 ${gb(max)}</span></div></div>` : '';
    const hint = !g.resizable && !gone && (g.kind === 'emummc' || g.kind === 'emufile')
      ? `<div class="hint">要调整大小，需要这台机器的密钥：在 hekate 里选 Payloads → Lockpick_RCM 导出一次，卡上会多出 switch/prod.keys。${g.reason ? '<br>' + esc(g.reason) : ''}</div>`
      : !g.resizable && !gone && g.reason ? `<div class="hint">${esc(g.reason)}</div>` : '';
    const acts = [changed && !gone ? '<button class="btn txt" data-act="reset">恢复原大小</button>' : '',
      g.deletable ? (gone ? '<button class="btn txt" data-act="keep">保留</button>' : '<button class="btn txt red" data-act="del">删除</button>') : ''].join('');
    return `<div class="pr ${gone ? 'gone' : ''}" data-id="${esc(g.id)}"><div class="hd"><span class="dot ${DOT[g.kind]}"></span>
      <div class="tt"><strong>${esc(g.label)}</strong><span>${sub}</span></div>
      <span class="v ${gone ? 'del' : ''}" data-v>${gone ? '将删除' : gb(g.new_bytes)}</span><span class="acts">${acts}</span></div>${slider}${hint}</div>`;
  }).join('');
  const html = `<div class="sec">分区 <span>· 虚拟系统可以调大小，分区可以删除</span></div><div class="card pl">
    <div class="pr"><div class="hd"><span class="dot c-fat"></span><div class="tt"><strong>放文件的空间（FAT32）</strong><span>剩下的空间都给它</span></div><span class="v">${gb(t.fat_bytes)}</span></div></div>${rows}</div>`;
  const bind = root => $$('.pr[data-id]', root).forEach(row => {
    const id = row.dataset.id, g = t.parts.find(x => x.id === id), input = $('.range', row);
    const set = value => { const next = { ...sizes, [id]: value }; if (value === g.bytes) delete next[id]; onChange(next); };
    if (input) {
      paintRange(input);
      input.oninput = () => { paintRange(input); $('[data-v]', row).textContent = gb(+input.value); };
      input.onchange = () => set(+input.value);
    }
    $$('[data-act]', row).forEach(b => b.onclick = () => set(b.dataset.act === 'del' ? 0 : g.bytes));
  });
  return { html, bind };
}
function paintRange(input) { input.style.setProperty('--fill-to', (input.max > input.min ? (input.value - input.min) / (input.max - input.min) * 100 : 0) + '%'); }
/* 开始前的确认：列出改了什么，删掉的用红字 */
function changesText(t) {
  const items = t.parts.filter(g => g.new_bytes !== g.bytes).map(g => !g.new_bytes
    ? `<li class="d">删除 ${esc(g.label)}（${gb(g.bytes)}），里面的东西会丢失</li>` : `<li>${esc(g.label)}：${gb(g.bytes)} → ${gb(g.new_bytes)}</li>`);
  return items.length ? `<ul class="chg">${items.join('')}</ul>` : '';
}
function viewTarget(pg) {
  const i = S.info, t = S.target, c = t.target, staged = S.src.kind === 'stage';
  const delta = t.fat_bytes - i.fat_bytes;
  const list = partsList(t, S.sizes, async sizes => {
    const r = await api.check(S.src, c.number, sizes);
    if (r.error) { toast(r.error); draw(true); return; }
    S.sizes = sizes; S.target = r; draw(true);
  });
  pg.innerHTML = `<h1>确认新卡</h1>
    ${staged ? '' : `<div class="card box"><h3>旧卡 <span class="small muted" style="font-weight:400">${esc(i.name)} · ${gb(i.size)}</span></h3>${storage(i.size, i.files.bytes, i.fat_bytes, i.extras)}</div><div class="arrowdown">${ic('arrow', 20)}</div>`}
    <div class="card box"><h3>新卡 <span class="small muted" style="font-weight:400">${esc(c.name)} · ${cardLine(c)}</span></h3>${storage(c.size, t.files_bytes, t.fat_bytes, t.extras)}
      <p class="small muted">放文件的空间${delta >= 0 ? '多出' : '减少'} ${gb(Math.abs(delta))}。</p></div>
    ${t.parts.length ? list.html : ''}
    <div class="warn">${ic('lock', 18)}<div><b>新卡上现有的内容会全部清除。</b>请确认上面这张是新卡。${staged ? '' : '旧卡不会被改动。'}</div></div>
    <div class="row"><button class="btn pri big" id="go">开始换卡</button><span class="small faint">${S.opts.verify ? '写完会把每个文件再核对一遍。' : '写完不核对文件，可以在设置里打开。'}</span></div>`;
  list.bind(pg);
  $('#go').onclick = async () => {
    if (!await ask({ title: `清除 ${esc(c.name)} 并开始？`, body: `${cardLine(c)} 上现有的内容会全部清除，这一步不能撤销。${changesText(t)}`, ok: '清除并开始', danger: true })) return;
    const r = await api.start_write(S.src, c.number, c.size, S.sizes);
    if (r.error) { tell('现在开始不了', esc(r.error)); return; }
    runJob(r.steps, '写入新卡', '请不要拔出存储卡。', moveEnded);
  };
}

/* ---------- 进度 ---------- */
const RING = '<svg class="ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="tk" cx="12" cy="12" r="9.5" fill="none" stroke-width="2.5"/><circle class="ar" cx="12" cy="12" r="9.5" fill="none" stroke-width="2.5" stroke-linecap="round" transform="rotate(-90 12 12)"/><g class="ok"><circle cx="12" cy="12" r="11" fill="var(--green)"/><path d="m7.5 12.3 3 3 6-6.3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>';
function viewRun(pg) {
  const j = S.run;
  pg.innerHTML = `<h1>${esc(j.title)}</h1>
    <div class="card now-card" id="nowc">
      <div class="now-top"><div><div class="eb" id="eb"></div><h2 id="sn"></h2></div><div class="pct" id="pct">0<small>%</small></div></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><b></b></div>
      <div class="meta"><span id="amt"></span><span id="eta"></span></div>
      <div class="cur" id="cur" hidden><span class="gi" id="cico"></span><div><strong id="cnm"></strong><span id="cdir"></span></div></div>
    </div>
    <div class="sec">全部步骤 <span id="all"></span></div>
    <div class="card stl">${j.steps.map((s, n) => `<div class="sr" data-n="${n}">${RING}<span class="nm">${esc(s)}</span><span class="nt"></span></div>`).join('')}</div>
    <div class="row"><button class="btn" id="pause">暂停</button><button class="btn" id="stop">停止</button><span class="small faint">${esc(j.hint)}</span></div>`;
  $('#pause').onclick = async () => { S.paused = !S.paused; await api.pause(S.paused); $('#pause').textContent = S.paused ? '继续' : '暂停'; pg.classList.toggle('paused', S.paused); };
  $('#stop').onclick = async () => {
    const body = { '写入新卡': '新卡会停在写了一半的状态，之后重新开始一次即可。旧卡不受影响。',
      '调整分区': '还在存到电脑时停下，卡不受影响；已经开始重建卡之后停下，卡会停在写了一半的状态，内容都还存在电脑上，可以到「换卡」里写回这张卡。' }[j.title] || '已经存下的部分会留着，下次重新存。';
    if (!await ask({ title: '停止？', body, ok: '停止', danger: true })) return;
    await api.stop();
  };
}
/* 正在处理的东西：文件拆成文件名和所在的文件夹，分区直接显示名字 */
function showCurrent(st) {
  const cur = $('#cur');
  if (!cur) return;
  const path = st.path || '', item = st.item || '', slash = path.lastIndexOf('/');
  const isFile = slash >= 0 || /\.[A-Za-z0-9]{1,5}$/.test(path);
  // 文件：名字 + 所在文件夹，第几个文件放到数量那一行；分区：名字 + 正在做的阶段
  $('#amt').textContent = [isFile ? item : '', st.detail].filter(Boolean).join(' · ');
  cur.hidden = !path && !item;
  if (cur.hidden) return;
  $('#cico').innerHTML = ic(isFile ? 'file' : 'sd', 16);
  $('#cnm').textContent = path ? path.slice(slash + 1) : item;
  $('#cnm').title = path;
  const sub = isFile ? (slash >= 0 ? path.slice(0, slash) : '卡的根目录') : path ? item : '';
  $('#cdir').className = isFile ? 'dir' : '';
  $('#cdir').innerHTML = `<bdi>${esc(sub)}</bdi>`;
}
const eta = s => s < 60 ? '1 分钟' : s < 3600 ? Math.ceil(s / 60) + ' 分钟' : Math.floor(s / 3600) + ' 小时 ' + Math.ceil(s % 3600 / 60) + ' 分钟';
async function runJob(steps, title, hint, ended) {
  S.run = { steps, title, hint }; S.running = true; S.paused = false; drawSide(); draw();
  const pace = { step: -1, t0: 0, f0: 0 };
  const state = await follow(st => {
    if (!$('#nowc')) return;
    const finished = !st.running && st.result, frac = finished ? 1 : st.frac;
    if (pace.step !== st.step) Object.assign(pace, { step: st.step, t0: performance.now(), f0: st.frac });
    $('#eb').textContent = `第 ${st.step + 1} 步，共 ${st.steps.length} 步`;
    $('#sn').textContent = st.steps[st.step] || '';
    $('#pct').firstChild.textContent = Math.floor(frac * 100);
    $('#bar b').style.transform = `scaleX(${frac})`;
    $('#bar').setAttribute('aria-valuenow', Math.floor(frac * 100));
    const spent = (performance.now() - pace.t0) / 1000, gained = st.frac - pace.f0;
    $('#eta').textContent = S.paused ? '已暂停' : spent > 4 && gained > 0.01 ? '还要约 ' + eta((1 - st.frac) * spent / gained) : (st.frac < 1 ? '正在估算剩余时间…' : '');
    showCurrent(st);
    $('#all').textContent = '· 总进度 ' + Math.floor((finished ? 1 : (st.step + st.frac) / st.steps.length) * 100) + '%';
    $$('.sr').forEach(el => {
      const n = +el.dataset.n, cls = finished || n < st.step ? 'done' : n === st.step ? 'now' : '';
      el.className = 'sr ' + cls;
      $('.ar', el).style.strokeDashoffset = 59.7 * (1 - (cls === 'now' ? frac : 0));
      $('.nt', el).textContent = cls === 'done' ? (st.notes && st.notes[n]) || '' : cls === 'now' ? Math.floor(frac * 100) + '%' : '';
    });
  });
  S.running = false;
  await ended(state, title);
}
async function moveEnded(state, title) {
  if (state.error || state.cancelled) {
    S.phase = S.src.kind === 'stage' ? 'saved' : 'info'; S.target = null;
    S.stage = await api.stage(); draw();
    if (state.error) tell(title + '没有完成', esc(state.error) + (title === '写入新卡' ? '<br><br>旧卡没有被改动。新卡可能停在写了一半的状态，重新开始一次即可。' : ''));
    return;
  }
  if (state.result.saved) { S.stage = await api.stage(); S.src = { kind: 'stage' }; S.info = S.stage.saved; S.phase = 'saved'; draw(); return; }
  S.done = state.result; S.stage = await api.stage(); S.phase = 'done'; draw();
}
function viewSaved(pg) {
  const s = S.info;
  pg.innerHTML = `<h1>旧卡已经存在电脑上</h1><p class="lead">${esc(s.name)}，${gb(s.copy_bytes)}。现在把旧卡拔下来，插上新卡。</p>
    <div class="sec">选择新卡</div>
    ${cardList(S.cards, '正在等待新卡…', '插上新卡会自动出现在这里。新卡上现有的内容会被清除。')}
    <div class="row"><button class="btn txt" id="later">以后再写</button></div>`;
  $$('.pick', pg).forEach(b => b.onclick = () => pickTarget(S.cards.find(c => c.number === +b.dataset.n)));
  $('#later').onclick = () => { reset(); draw(); };
}
function viewDone(pg) {
  const d = S.done, saved = S.stage && S.stage.saved;
  pg.innerHTML = `${OK_MARK}<div><h1>换好了</h1><p class="lead" style="margin-top:6px">把新卡插回 Switch 就能用。旧卡没有被改动，确认新卡没问题之前先别清空它。</p></div>
    <div class="card"><dl class="kv"><dt>新卡</dt><dd>${esc(d.name)} · ${gb(d.size)} · ${esc(d.letter.replace('\\', ''))}</dd><dt>文件</dt><dd>${fmt(d.files)} 个，${gb(d.bytes)}</dd>${d.parts ? `<dt>分区</dt><dd>搬了 ${d.parts} 个，已核对</dd>` : ''}${d.changed.length ? `<dt>虚拟系统的位置</dt><dd>已经改成新卡上的位置</dd>` : ''}${d.resized ? `<dt>虚拟系统的大小</dt><dd>已经按选的大小重建，内容核对过</dd>` : ''}${d.deleted ? `<dt>删掉的分区</dt><dd>${d.deleted} 个${d.emu_disabled ? '，虚拟系统已改成不启用' : ''}</dd>` : ''}<dt>放文件的空间</dt><dd>${gb(d.fat_bytes)}</dd></dl></div>
    ${d.staged && saved ? `<div class="card"><div class="li"><div><strong>电脑上还存着旧卡的内容</strong><span class="d">占 ${gb(saved.copy_bytes)}。确认新卡没问题之后可以删掉。</span></div><button class="btn" id="drop2">删除</button></div></div>` : ''}
    <div class="row"><button class="btn pri big" id="fin">完成</button></div>`;
  $('#fin').onclick = () => { reset(); draw(); };
  if ($('#drop2')) $('#drop2').onclick = async () => {
    if (!await ask({ title: '删除存在电脑上的旧卡内容？', body: `会释放 ${gb(saved.copy_bytes)}。`, ok: '删除', danger: true })) return;
    S.stage = await api.discard(); draw(true);
  };
}

/* ---------- 调整分区 ---------- */
VIEW.resize = pg => S.running ? viewRun(pg) : ({ pick: rPick, loading: viewLoading, edit: rEdit, done: rDone }[S.R.phase](pg));
function rPick(pg) {
  pg.innerHTML = `<h1>调整分区</h1><p class="lead">调整一张卡上虚拟系统的大小，或者删掉不要的分区。会先把整张卡存到电脑并核对，再清空这张卡按新的分区重建。</p>
    <div class="sec">选择存储卡</div>
    ${cardList(S.cards, S.R.notice ? esc(S.R.notice) : (S.notice || '正在等待存储卡…'), '把要调整的卡插到电脑上，会自动出现在这里。')}`;
  $$('.pick', pg).forEach(b => b.onclick = () => rOpen(S.cards.find(c => c.number === +b.dataset.n)));
}
async function rOpen(card) {
  S.R = { phase: 'loading', number: card.number, sizes: {} }; draw();
  const info = await api.inspect(card.number);
  if (S.R.phase !== 'loading' || S.R.number !== card.number) return;
  if (info.error) { S.R = { phase: 'pick' }; draw(); tell('读不了这张卡', esc(info.error)); return; }
  const t = await api.resize_check(card.number, {});
  if (S.R.phase !== 'loading') return;
  if (t.error) { S.R = { phase: 'pick' }; draw(); tell('这张卡调整不了', esc(t.error)); return; }
  Object.assign(S.R, { phase: 'edit', info, t }); draw();
}
function rEdit(pg) {
  const { info: i, t } = S.R, st = t.stage, enough = st.free > i.copy_bytes + 128 * 1048576;
  const changed = Object.keys(S.R.sizes).length > 0, delta = t.fat_bytes - i.fat_bytes;
  const list = partsList(t, S.R.sizes, async sizes => {
    const r = await api.resize_check(S.R.number, sizes);
    if (r.error) { toast(r.error); draw(true); return; }
    S.R.sizes = sizes; S.R.t = r; draw(true);
  });
  pg.innerHTML = `<h1>调整分区</h1>
    <div class="card box"><div class="dev"><span class="ico">${ic('sd', 22)}</span><div><strong>${esc(i.name)}</strong><span class="small muted">${gb(i.size)}${i.letter ? ' · ' + esc(i.letter.replace('\\', '')) : ''}</span></div></div>
      <div class="small muted">现在</div>${storage(i.size, i.files.bytes, i.fat_bytes, i.extras)}
      <div class="small muted" style="margin-top:4px">调整之后</div>${storage(i.size, t.files_bytes, t.fat_bytes, t.extras)}
      <p class="small muted">${changed ? `放文件的空间${delta >= 0 ? '多出' : '减少'} ${gb(Math.abs(delta))}。` : '还没有改动。在下面调整虚拟系统的大小，或者删掉不要的分区。'}</p></div>
    ${t.parts.length ? list.html : '<div class="card box"><p class="muted">这张卡上只有放文件的空间，没有可以调整的分区。</p></div>'}
    <div class="sec">先存到电脑</div>
    <div class="card"><div class="li"><div><strong>需要 ${gb(i.copy_bytes)}，这个位置还剩 ${gb(st.free)}</strong><span class="d mono">${esc(st.dir)}</span>${enough ? '' : '<span class="d" style="color:var(--red)">空间不够，请换一个位置</span>'}</div><button class="btn" id="chdir">更改…</button></div></div>
    <div class="warn">${ic('lock', 18)}<div><b>这张卡会被清空，再按新的分区重建。</b>开始前会把整张卡完整存到电脑并核对一遍；中途出了问题，内容也都还在电脑上。</div></div>
    <div class="row"><button class="btn pri big" id="go" ${changed && enough ? '' : 'disabled'}>开始调整</button><span class="small faint">${changed ? '' : '先在上面做些改动'}</span></div>`;
  list.bind(pg);
  $('#chdir').onclick = async () => { const r = await api.pick_stage_dir(); if (!r.cancelled) { S.R.t.stage = r; draw(true); } };
  $('#go').onclick = async () => {
    if (!await ask({ title: `调整 ${esc(i.name)}？`, body: `会先把整张卡存到电脑并核对，然后清空这张卡按新的分区重建：${changesText(t)}`, ok: '开始调整', danger: true })) return;
    const r = await api.start_resize(S.R.number, i.size, S.R.sizes);
    if (r.error) { tell('现在开始不了', esc(r.error)); return; }
    runJob(r.steps, '调整分区', '请不要拔出存储卡。', resizeEnded);
  };
}
async function resizeEnded(state) {
  S.stage = await api.stage();
  if (state.error || state.cancelled) {
    const wiped = state.danger;
    S.R = { phase: 'pick' }; draw();
    const tail = wiped ? '<br><br>卡已经开始重建了，但卡上原来的内容都完整地存在电脑上。到「换卡」里，用"存在电脑上的旧卡 → 写入新卡"把它写回这张卡即可。' : '<br><br>卡还没有被改动。';
    if (state.error) tell('调整没有完成', esc(state.error) + tail);
    else if (wiped) tell('已停止', tail.slice(8));
    return;
  }
  S.R = { phase: 'done', d: state.result }; draw();
}
function rDone(pg) {
  const d = S.R.d, saved = S.stage && S.stage.saved;
  pg.innerHTML = `${OK_MARK}<div><h1>调整好了</h1><p class="lead" style="margin-top:6px">把卡插回 Switch 就能用。确认没问题之前，先别删电脑上存的那份。</p></div>
    <div class="card"><dl class="kv"><dt>存储卡</dt><dd>${esc(d.name)} · ${gb(d.size)} · ${esc(d.letter.replace('\\', ''))}</dd><dt>文件</dt><dd>${fmt(d.files)} 个，${gb(d.bytes)}，都核对过</dd>
      ${d.parts ? `<dt>分区</dt><dd>${d.parts} 个，已核对</dd>` : ''}${d.resized ? `<dt>调整了大小</dt><dd>${d.resized} 个虚拟系统，内容核对过</dd>` : ''}
      ${d.deleted ? `<dt>删掉的分区</dt><dd>${d.deleted} 个${d.emu_disabled ? '，虚拟系统已改成不启用' : ''}</dd>` : ''}<dt>放文件的空间</dt><dd>${gb(d.fat_bytes)}</dd></dl></div>
    ${saved ? `<div class="card"><div class="li"><div><strong>电脑上还存着调整前的内容</strong><span class="d">占 ${gb(saved.copy_bytes)}。确认卡没问题之后可以删掉。</span></div><button class="btn" id="drop3">删除</button></div></div>` : ''}
    <div class="row"><button class="btn pri big" id="fin">完成</button></div>`;
  $('#fin').onclick = () => { S.R = { phase: 'pick' }; draw(); };
  if ($('#drop3')) $('#drop3').onclick = async () => {
    if (!await ask({ title: '删除电脑上存的那份？', body: `会释放 ${gb(saved.copy_bytes)}。`, ok: '删除', danger: true })) return;
    S.stage = await api.discard(); draw(true);
  };
}

/* ---------- 设置 ---------- */
VIEW.settings = async pg => {
  pg.innerHTML = `<h1>设置</h1>
    <div class="sec">写入</div><div class="card"><div class="li"><div><strong>写完后核对文件</strong><span class="d">把新卡上的每个文件再读一遍，确认和旧卡一致。复制文件的时间大约多一倍</span></div><button class="sw" role="switch" aria-checked="${!!S.opts.verify}" id="verify" aria-label="写完后核对文件"></button></div></div>
    <div class="sec">只有一个读卡器时</div><div class="card"><div class="li"><div><strong>旧卡先存到这里</strong><span class="d mono" id="sdir"></span><span class="d" id="sfree"></span></div><button class="btn" id="chdir">更改…</button></div></div>`;
  $('#verify').onclick = async e => { S.opts = await api.set_option('verify', !S.opts.verify); e.currentTarget.setAttribute('aria-checked', !!S.opts.verify); };
  const show = st => { S.stage = st; if ($('#sdir')) { $('#sdir').textContent = st.dir; $('#sfree').textContent = `还剩 ${gb(st.free)}`; } };
  $('#chdir').onclick = async () => { const r = await api.pick_stage_dir(); if (!r.cancelled) show(r); };
  show(await api.stage());
};

window.addEventListener('pywebviewready', async () => {
  api = window.pywebview.api;
  const info = await api.ready();
  applyTheme(info.settings.theme);
  S.opts = await api.options();
  if (!info.admin) S.notice = '没有管理员权限，读不了存储卡。请从工具箱首页打开换卡。';
  drawSide(); draw(); watchCards();
});
</script>
</body>
</html>
