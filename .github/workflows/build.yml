# 在 GitHub 上打包。签名用 SignPath Foundation 的开源代码签名：
# 仓库变量 SIGNPATH_ORGANIZATION_ID 和密钥 SIGNPATH_API_TOKEN 都配好才会签，没配就打未签名的包。
# 签名分两次：先签程序 NXToolbox.exe（它会被压进安装程序里），再签安装程序，最后按签好的安装程序写 version.json。
name: Build

on:
  workflow_dispatch:
  push:
    branches: ["v2"]      # 平时推代码只检查能不能打包，不签名
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Read version
        id: app
        shell: pwsh
        run: '"version=$((Get-Content app.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT'

      - name: Build app
        run: python build.py --stage=app

      - name: Upload unsigned app
        id: app-unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/NXToolbox/NXToolbox.exe

      - name: Sign app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nx-toolbox
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          parameters: |
            version: "${{ steps.app.outputs.version }}"
          output-artifact-directory: dist/NXToolbox

      - name: Build installer
        run: python build.py --stage=setup

      - name: Upload unsigned installer
        id: setup-unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: release/NXToolbox-*.exe

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nx-toolbox
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          parameters: |
            version: "${{ steps.app.outputs.version }}"
          output-artifact-directory: release

      - name: Write update manifest
        run: python build.py --stage=manifest

      - name: Show hashes
        shell: pwsh
        run: |
          Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | Format-Table Hash, Path -AutoSize
          Get-AuthenticodeSignature release/NXToolbox-*.exe | Format-Table Status, SignerCertificate -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/

      # 打标签触发时，把安装程序放进同名的 Release 草稿；还没有就建一个。
      # 已经发布的 Release 不动：它的文件和下载站、version.json 里的 SHA-256 是一套，重新打标签不能把它换掉。
      - name: Attach to GitHub Release draft
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $draft = gh release view $env:TAG --json isDraft -q .isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            $pre = if ($env:TAG -match '-') { '--prerelease' } else { '' }
            gh release create $env:TAG --draft $pre --title $env:TAG --notes "Draft created by the build workflow."
            $draft = 'true'
          }
          if ($draft -ne 'true') {
            Write-Host "Release $env:TAG is already published; leaving its files alone. The build is in the 'release' artifact."
            exit 0
          }
          gh release upload $env:TAG (Get-ChildItem release/NXToolbox-*.exe).FullName --clobber
